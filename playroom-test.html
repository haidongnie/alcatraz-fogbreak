<!doctype html><html><body><pre id="log">starting…</pre>
<script type="module">
import { insertCoin, myPlayer, isHost, getRoomCode, onPlayerJoin } from 'playroomkit';
const log = (m) => { document.getElementById('log').textContent += '\n' + m; console.log('[pt]', m); };
try {
  await insertCoin({ skipLobby: true });
  log('insertCoin OK host=' + isHost() + ' room=' + getRoomCode() + ' me=' + myPlayer()?.id + ' name=' + myPlayer()?.getProfile()?.name);
  onPlayerJoin((p) => log('join ' + p.id));
} catch (e) { log('ERR ' + (e?.message || e)); }
</script></body></html>
